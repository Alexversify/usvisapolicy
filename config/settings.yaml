# 수집 대상과 번역 설정. 소스를 추가하거나 빼려면 여기만 고치면 됩니다.

# 번역·요약 모델. 비용을 줄이려면 하위 모델로 바꿉니다.
model: claude-sonnet-5

# 한 번 실행에 새로 번역할 최대 건수. API 비용 상한 역할을 합니다.
max_new_per_run: 15

# 최초 실행 시 거슬러 올라갈 기간(일). 이후 실행은 새 글만 잡습니다.
backfill_days: 45

# 사이트 언어. 순서대로 언어 메뉴에 표시됩니다. 첫 번째가 기준 언어입니다.
languages: [ko, en, es, zh, ja]

sources:
  uscis_news:
    enabled: true
    label: USCIS
    # USCIS는 봇 차단이 있어 Playwright 실제 브라우저로 엽니다.
    list_urls:
      - https://www.uscis.gov/newsroom/all-news
      - https://www.uscis.gov/newsroom/alerts
    link_pattern: "/newsroom/(news-releases|alerts|press-releases|news-releases-and-alerts)/[^?#]+"

  uscis_policy_manual:
    enabled: true
    label: USCIS Policy Manual
    # Policy Manual 개정 공지 (예: 2026-10-02 EAD 자동연장 기술 개정). 뉴스룸에 안 올라오는 정책 변경이 여기 있습니다.
    list_urls:
      - https://www.uscis.gov/policy-manual/updates
    # 개정 공지 PDF만. /policy-manual/volume-* 는 매뉴얼 목차라 잡으면 안 됩니다.
    link_pattern: "/sites/default/files/document/policy-manual-updates/[^?#]+"
    context_as_text: true
    max_items: 15

  dos_visa_news:
    enabled: true
    label: Department of State
    # GitHub Actions 서버는 Cloudflare 확인 화면에 막힙니다. 막히면 인터넷 아카이브 최신 사본을 읽습니다.
    # 차단이 알려진 소스라 연속 실패해도 알림을 보내지 않습니다.
    alert: false
    archive_fallback: true
    archive_max_age_days: 14
    list_urls:
      - https://travel.state.gov/content/travel/en/News/visas-news.html
    link_pattern: "/content/travel/en/News/visas-news/(?!archive)[^?#]+\\.html"

  visa_bulletin:
    enabled: true
    label: Visa Bulletin
    # GitHub Actions 서버는 Cloudflare 확인 화면에 막힙니다. 막히면 인터넷 아카이브 최신 사본을 읽습니다.
    # 차단이 알려진 소스라 연속 실패해도 알림을 보내지 않습니다.
    alert: false
    archive_fallback: true
    archive_max_age_days: 14
    list_urls:
      - https://travel.state.gov/content/travel/en/legal/visa-law0/visa-bulletin.html
    link_pattern: "/visa-bulletin/20\\d\\d/visa-bulletin-for-[a-z]+-20\\d\\d\\.html"
    # 최신 몇 개월치만 봅니다.
    max_items: 2

  uscis_vb_chart:
    enabled: true
    label: Visa Bulletin (USCIS)
    # travel.state.gov는 Actions 서버에서 막히고 인터넷 아카이브도 7월 이후 사본이 없습니다.
    # USCIS가 매달 올리는 Visa Bulletin 차트 공지로 새 Bulletin과 적용 차트를 잡습니다.
    url: https://www.uscis.gov/green-card/green-card-processes-and-procedures/visa-availability-priority-dates/adjustment-of-status-filing-charts-from-the-visa-bulletin

  state_press:
    enabled: true
    label: Department of State
    # 국무부 본 사이트 보도자료. travel.state.gov와 달리 막히지 않으면 비자 관련 발표를 여기서 잡습니다.
    list_urls:
      - https://www.state.gov/press-releases/
    link_pattern: "https://www\\.state\\.gov/releases/[^?#]+"
    title_pattern: "visa|immigra|consular|passport|travel advisory|entry|nonimmigrant|refugee|asylum|deport|removal|migrant|border"
    max_items: 20

  federal_register:
    enabled: true
    label: Federal Register
    # 공개 API, 키 불필요. 규칙 제정과 공고를 시행 전에 잡습니다.
    # USCIS·국무부만 보면 DHS 본부나 ICE(SEVP, 유학생 F-1/OPT), CBP, 노동부(H-1B LCA, PERM),
    # 이민법원(EOIR) 명의 규정을 놓칩니다. 예: 2026-10 OPT 수수료 규정안은 DHS/ICE 명의.
    agencies:
      - u-s-citizenship-and-immigration-services
      - state-department
      - homeland-security-department
      - u-s-immigration-and-customs-enforcement
      - u-s-customs-and-border-protection
      - employment-and-training-administration
      - executive-office-for-immigration-review
    types: [RULE, PRORULE, NOTICE]
    # 한 페이지 100건. 정보수집 공고가 많아 여러 페이지를 봐야 실제 규정이 빠지지 않습니다.
    max_pages: 5
    # 연방관보 검색은 OR 대신 | 를 씁니다.
    term: "visa | immigration | immigrant | nonimmigrant | naturalization | asylum | parole"
    # 제목에 이 문구가 있으면 버립니다. 정보수집 공고는 실무 영향이 거의 없습니다.
    skip_title_prefixes:
      - "Information Collection"
      - "Currently Approved Collection"
      - "International Traffic in Arms"
      - "Culturally Significant Objects"

  fr_public_inspection:
    enabled: true
    label: Federal Register (Public Inspection)
    # 연방관보 게재 하루 전 공개열람본. 규정안이 발표되는 날 바로 잡습니다.
    # 다음 날 정식 게재본은 같은 문서 번호라 중복 게시하지 않습니다.
    agencies:
      - u-s-citizenship-and-immigration-services
      - state-department
      - homeland-security-department
      - u-s-immigration-and-customs-enforcement
      - u-s-customs-and-border-protection
      - employment-and-training-administration
      - executive-office-for-immigration-review
      - executive-office-of-the-president
    types: [Rule, Proposed Rule, Notice, Presidential Document]
    # 이 기관 문서는 제목 키워드 없이 받습니다.
    core_agencies:
      - u-s-citizenship-and-immigration-services
      - u-s-immigration-and-customs-enforcement
      - executive-office-for-immigration-review
    title_pattern: "practical training|OPT|F-1|J-1|visa|immigra|alien|nonimmigrant|naturaliz|asylum|parole|refugee|student|exchange visitor|SEVP|SEVIS|H-1B|H-2|labor certification|entry|deport|removal|citizenship|employment authorization|TPS|temporary protected"
    skip_title_prefixes:
      - "Information Collection"
      - "Currently Approved Collection"
      - "Agency Information Collection"

  dhs_news:
    # DHS 본부 보도자료. 단속 홍보가 많지만 내리지 않고 기관(DHS/ICE)·주제(단속)로 분류해 게시합니다.
    enabled: true
    label: DHS
    list_urls:
      - https://www.dhs.gov/news-releases/press-releases
    link_pattern: "/news/20\\d\\d/\\d\\d/\\d\\d/[^?#]+"
    max_items: 20
    title_pattern: "practical training|visa|immigra|alien|migrant|nonimmigrant|naturaliz|asylum|parole|refugee|student|OPT|F-1|SEVP|SEVIS|H-1B|H-2|green card|citizenship|deport|removal|border|ICE|CBP|USCIS|TPS|entry|travel ban|work permit|employment authorization"

  presidential:
    enabled: true
    label: White House
    # 비자·입국 관련 대통령 포고문과 행정명령 (Federal Register 게재분)
    types: [PRESDOCU]
    term: "visa | immigrants | aliens | nonimmigrant"
