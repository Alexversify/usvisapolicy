name: backfill

# 2026-01-01 이후 과거 글을 채우고, 기존 기사의 원문 전문 보관과 전문 번역을 채웁니다.
# Claude 구독 사용량을 아끼려고 하루 2번(KST 10:52, 22:52), 회당 새 글 5건·전문 8건만 천천히 채웁니다.

on:
  schedule:
    - cron: "52 1,13 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: "이번 실행에서 새로 번역할 과거 글 수"
        default: "5"
      fulltext:
        description: "이번 실행에서 전문을 채울 기존 기사 수"
        default: "8"

permissions:
  contents: write
  actions: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  # 구독 토큰 시크릿이 없으면 아무것도 하지 않고 끝냅니다 (이어달리기도 안 함). 시크릿을 넣으면 다음 cron 부터 자동으로 돕니다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$T" ] || [ -n "$K" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN 시크릿이 모두 없어 건너뜁니다"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

  backfill:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Claude Code CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 코드 연결 (이미 됐으면 그대로)
        run: |
          python scripts/migrate_fulltext.py
          python -m py_compile src/*.py

      - name: 과거 글 수집, 번역, 전문 보관
        timeout-minutes: 80
        continue-on-error: true
        env:
          # API 크레딧 먼저, 부족하면 Max 구독, 둘 다 소진되면 번역을 멈춤 (src/llm.py)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEADFUL: "1"
          PYTHONUNBUFFERED: "1"
          BACKFILL: "1"
          MAX_NEW: ${{ github.event.inputs.max_new || '5' }}
          NEW_BUDGET_MIN: "30"
          FULLTEXT_BACKFILL: ${{ github.event.inputs.fulltext || '8' }}
          FULLTEXT_BUDGET_MIN: "25"
          RUN_DEADLINE_MIN: "65"
        run: |
          set -o pipefail
          xvfb-run -a python -m src.main 2>&1 | tee /tmp/run.log

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "usvisapolicy-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/keep_articles.py HEAD
          python -m src.main --render-only
          git add data docs src config CLAUDE.md
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "backfill: 과거 글·전문 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch -q origin main
            git merge -q --no-edit -X ours origin/main || { git merge --abort; exit 1; }
            python scripts/keep_articles.py origin/main
            python -m src.main --render-only
            git add data docs
            git diff --staged --quiet || git commit -q -m "backfill: 사이트 재생성"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 15))
          done
          exit 1
