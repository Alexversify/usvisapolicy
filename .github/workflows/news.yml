name: news

# GitHub 예약 실행(cron)은 몇 시간씩 밀리는 일이 잦아, 실행이 끝날 때 다음 실행을 직접 예약합니다.
# 다음 실행은 20분 쉬었다가 수집합니다. cron 은 이어달리기가 끊겼을 때 다시 살리는 예비용입니다.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      chained:
        description: "이전 실행이 예약한 실행 (20분 쉬었다 시작)"
        default: "false"

permissions:
  contents: write
  actions: write

jobs:
  pause:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.chained == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: sleep 1200

  collect:
    needs: pause
    if: always() && needs.pause.result != 'failure' && needs.pause.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: news
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Claude Code CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집, 번역, 사이트 생성
        env:
          # API 키가 아니라 Claude 구독(Max) 토큰으로 번역합니다. API 비용이 나가지 않습니다.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEADFUL: "1"
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python -m src.main

      - name: 결과 커밋
        run: |
          git config user.name "usvisapolicy-bot"
          git config user.email "actions@users.noreply.github.com"
          # 한 번 올린 기사는 내리지 않습니다. 빠진 기사가 있으면 되살립니다.
          python scripts/keep_articles.py HEAD
          python -m src.main --render-only
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "news: 업데이트 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 피드백 반영 PR, backfill 등과 겹쳐도 멈추지 않게 최신 main 을 합치고 다시 생성합니다.
          for i in 1 2 3; do
            git fetch -q origin main
            # 겹치는 파일은 이번 수집 결과를 우선하고, 다른 변경은 그대로 둡니다. docs/ 는 아래에서 다시 생성합니다.
            git merge -q --no-edit -X ours origin/main || { git merge --abort; exit 1; }
            python scripts/keep_articles.py origin/main
            python -m src.main --render-only
            git add data docs
            git diff --staged --quiet || git commit -q -m "news: 사이트 재생성"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 15))
          done
          exit 1

      - name: 다음 실행 예약
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 이미 대기 중이거나 도는 다른 news 실행이 있으면 예약하지 않습니다 (이어달리기가 겹치지 않게).
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow news.yml --limit 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\"))] | length")
          if [ "$n" = "0" ]; then
            gh workflow run news.yml -R "$GITHUB_REPOSITORY" --ref main -f chained=true
            echo "다음 실행 예약됨"
          else
            echo "다른 실행 $n건 대기 중, 예약 생략"
          fi

      # 소스가 계속 실패하거나 번역이 멈추면 실행을 실패로 표시합니다. GitHub이 저장소 소유자에게 메일을 보냅니다.
      - name: 상태 점검
        run: python scripts/health.py
