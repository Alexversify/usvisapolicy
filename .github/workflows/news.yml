name: news

on:
  schedule:
    # 3시간마다. GitHub 예약 실행은 몇 시간씩 늦게 뜨는 일이 잦아 하루 2회로는 발표 반영이 반나절 넘게 늦습니다.
    # 새 글만 번역하므로 실행이 잦아도 API 비용은 늘지 않습니다. 정각을 피해 지연을 줄입니다.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집, 번역, 사이트 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEADFUL: "1"
        run: xvfb-run -a python -m src.main

      - name: 결과 커밋
        run: |
          git config user.name "usvisapolicy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "news: 업데이트 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
