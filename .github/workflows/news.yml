name: news

# 3시간마다 수집합니다 (Claude 구독 사용량을 아끼려고 이어달리기는 쓰지 않습니다).

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # 구독 토큰 시크릿이 없으면 아무것도 하지 않고 끝냅니다 (이어달리기도 안 함). 시크릿을 넣으면 다음 cron 부터 자동으로 돕니다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$T" ] || [ -n "$K" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN 시크릿이 모두 없어 건너뜁니다"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

  collect:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: news
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Claude Code CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집, 번역, 사이트 생성
        env:
          # API 크레딧 먼저, 부족하면 Max 구독, 둘 다 소진되면 번역을 멈춤 (src/llm.py)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEADFUL: "1"
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python -m src.main

      - name: 결과 커밋
        run: |
          git config user.name "usvisapolicy-bot"
          git config user.email "actions@users.noreply.github.com"
          # 한 번 올린 기사는 내리지 않습니다. 빠진 기사가 있으면 되살립니다.
          python scripts/keep_articles.py HEAD
          python -m src.main --render-only
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "news: 업데이트 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 피드백 반영 PR, backfill 등과 겹쳐도 멈추지 않게 최신 main 을 합치고 다시 생성합니다.
          for i in 1 2 3; do
            git fetch -q origin main
            # 겹치는 파일은 이번 수집 결과를 우선하고, 다른 변경은 그대로 둡니다. docs/ 는 아래에서 다시 생성합니다.
            git merge -q --no-edit -X ours origin/main || { git merge --abort; exit 1; }
            python scripts/keep_articles.py origin/main
            python -m src.main --render-only
            git add data docs
            git diff --staged --quiet || git commit -q -m "news: 사이트 재생성"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 15))
          done
          exit 1

      # 소스가 계속 실패하거나 번역이 멈추면 실행을 실패로 표시합니다. GitHub이 저장소 소유자에게 메일을 보냅니다.
      - name: 상태 점검
        run: python scripts/health.py
