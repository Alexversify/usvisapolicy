name: news

on:
  schedule:
    # 3시간마다. GitHub 예약 실행은 몇 시간씩 늦게 뜨는 일이 잦아 하루 2회로는 발표 반영이 반나절 넘게 늦습니다.
    # 새 글만 번역하므로 실행이 잦아도 API 비용은 늘지 않습니다. 정각을 피해 지연을 줄입니다.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집, 번역, 사이트 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEADFUL: "1"
        run: xvfb-run -a python -m src.main

      - name: 결과 커밋
        run: |
          git config user.name "usvisapolicy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "news: 업데이트 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 피드백 반영 PR 등과 docs/ 가 겹쳐도 멈추지 않게 최신 main 을 합치고 다시 생성합니다.
          for i in 1 2 3; do
            git fetch -q origin main
            # 겹치는 파일은 이번 수집 결과를 우선하고, 다른 변경은 그대로 둡니다. docs/ 는 아래에서 다시 생성합니다.
            git merge -q --no-edit -X ours origin/main || { git merge --abort; exit 1; }
            python -m src.main --render-only
            git add data docs
            git diff --staged --quiet || git commit -q -m "news: 사이트 재생성"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 15))
          done
          exit 1

      # 소스가 계속 실패하거나 번역이 멈추면 실행을 실패로 표시합니다. GitHub이 저장소 소유자에게 메일을 보냅니다.
      - name: 상태 점검
        run: python scripts/health.py
