name: bootstrap
on:
  push:
    paths: [repo.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o repo.zip -d . && rm repo.zip
          git config user.name "usvisapolicy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -m "init: usvisapolicy.com" && git push
